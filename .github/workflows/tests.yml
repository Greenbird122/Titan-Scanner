name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned: unpinned tooling drifted and broke the gate silently.
          # Bump deliberately, in its own commit, after `ruff check .` passes.
          pip install ruff==0.16.6 mypy==2.3.1 detect-secrets==1.5.0
          pip install -r requirements.txt  # committed lockfile (pinned)
          pip install -e .

      - name: Ruff lint
        # Gating on the rules the tree satisfies; ignored rules are tracked
        # debt in pyproject.toml [tool.ruff.lint].ignore (fold back in as the
        # hardening campaigns land).
        run: ruff check .

      # `ruff format --check` is parked: the tree predates ruff-format and a
      # 282-file reformat would be pure churn. Re-enable once the formatting
      # campaign lands (specs/engine-800-feasibility.md tracks it).

      - name: Detect-secrets scan
        # Fails the build if a secret-like literal is committed beyond the
        # audited baseline (.secrets.baseline). Regenerate the baseline with
        # `detect-secrets scan > .secrets.baseline` after an intentional change.
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Mypy typecheck
        # Gating: mypy must pass on the checked subset (171 files). Modules
        # listed under [tool.mypy] exclude + follow_imports=skip overrides in
        # pyproject.toml are not yet clean; fold them in as they get fixed.
        run: mypy titan/ --ignore-missing-imports

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Hard ceiling so a hang fails loudly instead of burning the default 6h.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest-timeout pytest-cov

      # No `playwright install chromium`: the only Playwright import is lazy
      # (inside TitanEngine.scan), and no unit test launches a browser — all
      # tests use fakes/stubs. Installing the browser would add minutes and
      # 500MB+ per run for nothing.
      - name: Run test suite
        # 120s per test: far above any normal test; a genuine hang is killed
        # here and reported by name. -p no:cacheprovider keeps the run hermetic.
        # --cov=titan + fail_under in pyproject makes the coverage floor a gate:
        # the job fails if coverage drops below the committed threshold.
        run: python -m pytest -q --timeout=120 -p no:cacheprovider --junitxml=test-results.xml --cov=titan --cov-report=term --cov-fail-under=44

      - name: Summarize results
        if: always()
        run: |
          python - <<'EOF'
          import re
          try:
              text = open("test-results.xml", encoding="utf-8").read()
              m = re.search(r'tests="(\d+)".*?failures="(\d+)".*?errors="(\d+)".*?skipped="(\d+)"', text)
              if m:
                  t, f, e, s = m.groups()
                  print(f"tests={t} failures={f} errors={e} skipped={s}")
          except FileNotFoundError:
              pass
          EOF

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
