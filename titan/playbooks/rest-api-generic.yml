name: rest-api-generic
version: 1.0
description: |
  Generic REST API playbook. Covers OpenAPI/Swagger discovery, JWT
  analysis, BOLA/IDOR via sequential ID probing, mass assignment via
  extra fields, HTTP method tampering, rate limiting analysis, and
  common API gateway misconfigurations.

fingerprint:
  body:
    - '"swagger"|"openapi"|"/api/v[0-9]"|"endpoints"'
  headers:
    content-type: "application/json|application/hal\\+json"
  url:
    - "/api/|/rest/|/v[0-9]/"

auth:
  login_url: null
  # JWT-based auth
  token_header: "Authorization"
  token_scheme: "Bearer"
  # API key auth
  api_key_header: "X-API-Key"
  # Basic auth
  basic_header: "Authorization"
  basic_scheme: "Basic"

# ─── API Discovery Probes ──────────────────────────────────────────────
http_probes:
  # OpenAPI/Swagger discovery
  - path: "/swagger.json"
    method: GET
    finding: "Swagger spec exposed at /swagger.json"
    severity: medium
    verify: "200 with JSON spec"
  - path: "/swagger/v1/swagger.json"
    method: GET
    finding: "Swagger spec at /swagger/v1/swagger.json"
    severity: medium
    verify: "200 with JSON spec"
  - path: "/openapi.json"
    method: GET
    finding: "OpenAPI spec at /openapi.json"
    severity: medium
    verify: "200 with JSON spec"
  - path: "/openapi.yaml"
    method: GET
    finding: "OpenAPI spec at /openapi.yaml"
    severity: medium
    verify: "200 with YAML spec"
  - path: "/api-docs"
    method: GET
    finding: "Swagger UI at /api-docs"
    severity: medium
    verify: "200 with HTML docs"
  - path: "/docs"
    method: GET
    finding: "API docs at /docs"
    severity: medium
    verify: "200 with HTML docs"
  - path: "/redoc"
    method: GET
    finding: "ReDoc at /redoc"
    severity: medium
    verify: "200 with HTML docs"
  - path: "/api/swagger.json"
    method: GET
    finding: "Swagger at /api/swagger.json"
    severity: medium
    verify: "200 with JSON spec"
  - path: "/api/openapi.json"
    method: GET
    finding: "OpenAPI at /api/openapi.json"
    severity: medium
    verify: "200 with JSON spec"
  - path: "/.well-known/openapi.json"
    method: GET
    finding: "OpenAPI in well-known"
    severity: medium
    verify: "200 with JSON spec"

  # Common API health/info endpoints
  - path: "/api/health"
    method: GET
    finding: "API health endpoint — may leak version, dependencies, status"
    severity: low
    verify: "200 with health info"
  - path: "/api/info"
    method: GET
    finding: "API info endpoint — may leak version, config"
    severity: low
    verify: "200 with info"
  - path: "/api/version"
    method: GET
    finding: "API version endpoint"
    severity: low
    verify: "200 with version"
  - path: "/api/status"
    method: GET
    finding: "API status endpoint"
    severity: low
    verify: "200 with status"
  - path: "/healthz"
    method: GET
    finding: "Kubernetes health endpoint"
    severity: low
    verify: "200"
  - path: "/health"
    method: GET
    finding: "Health endpoint"
    severity: low
    verify: "200"
  - path: "/metrics"
    method: GET
    finding: "Prometheus metrics endpoint — may leak internal counters"
    severity: medium
    verify: "200 with metrics text"
  - path: "/actuator"
    method: GET
    finding: "Spring Boot Actuator exposed — heap dump, env, beans"
    severity: critical
    verify: "200 with actuator links"
  - path: "/actuator/env"
    method: GET
    finding: "Spring Boot Actuator env — environment variables leak"
    severity: critical
    verify: "200 with env vars"
  - path: "/actuator/heapdump"
    method: GET
    finding: "Spring Boot Actuator heap dump — memory dump with secrets"
    severity: critical
    verify: "200 with binary data"
  - path: "/actuator/mappings"
    method: GET
    finding: "Spring Boot Actuator mappings — all endpoint enumeration"
    severity: high
    verify: "200 with endpoint mappings"

  # JWT analysis
  - path: "/api/auth/login"
    method: POST
    body: '{"username":"admin","password":"admin"}'
    content_type: "application/json"
    finding: "Default admin credentials attempt"
    severity: high
    verify: "200 with JWT token"
    extract:
      - pattern: '"(token|access_token|jwt)"\s*:\s*"([^"]+)"'
        field: jwt

# ─── BOLA/IDOR Probes ──────────────────────────────────────────────────
# These are parameterized — the agent fills in discovered endpoint + IDs
bola_probes:
  - template: "/api/users/{id}"
    id_range: [1, 2, 3, 5, 10, 100, 999]
    method: GET
    finding: "BOLA — user data accessible by sequential ID"
    severity: high
    verify: "200 with different user data for different IDs"
  - template: "/api/orders/{id}"
    id_range: [1, 2, 3, 5, 10, 100]
    method: GET
    finding: "BOLA — order data accessible by sequential ID"
    severity: high
    verify: "200 with different order data"
  - template: "/api/accounts/{id}"
    id_range: [1, 2, 3, 5, 10]
    method: GET
    finding: "BOLA — account data accessible by sequential ID"
    severity: high
    verify: "200 with different account data"
  - template: "/api/documents/{id}"
    id_range: [1, 2, 3, 5, 10]
    method: GET
    finding: "BOLA — document data accessible by sequential ID"
    severity: high
    verify: "200 with different document data"

# ─── Mass Assignment Probes ─────────────────────────────────────────────
mass_assignment_probes:
  - template: "/api/users/{id}"
    method: PUT
    body: '{"role":"admin","is_admin":true,"admin":true,"permissions":["*"]}'
    content_type: "application/json"
    finding: "Mass assignment — role escalation via PUT"
    severity: critical
    verify: "200 with updated role"
  - template: "/api/profile"
    method: PATCH
    body: '{"verified":true,"email_verified":true,"tier":"premium"}'
    content_type: "application/json"
    finding: "Mass assignment — profile field escalation"
    severity: high
    verify: "200 with updated fields"

# ─── HTTP Method Tampering ──────────────────────────────────────────────
method_tampering:
  - template: "/api/users"
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS", "TRACE"]
    finding: "HTTP method tampering — unexpected methods accepted"
    severity: medium
    verify: "non-standard method returns non-405"

# ─── Rate Limiting Analysis ────────────────────────────────────────────
rate_limiting:
  - endpoint: "/api/auth/login"
    method: POST
    count: 50
    finding: "No rate limiting on login — brute force possible"
    severity: high
    verify: "all 50 requests return same status (no 429)"
  - endpoint: "/api/auth/forgot-password"
    method: POST
    count: 20
    finding: "No rate limiting on password reset — email bombing"
    severity: medium
    verify: "all 20 requests return same status"

discovery_seeds:
  - "/swagger.json"
  - "/openapi.json"
  - "/api-docs"
  - "/docs"
  - "/redoc"
  - "/api/"
  - "/api/v1/"
  - "/api/health"
  - "/api/info"
  - "/metrics"
  - "/actuator"
  - "/actuator/env"
  - "/actuator/mappings"
  - "/.well-known/openapi.json"

expected_findings:
  - type: "API Exposure"
    description: "OpenAPI/Swagger spec exposed"
    severity: medium
  - type: "BOLA"
    description: "Sequential ID access without authorization"
    severity: high
  - type: "Mass Assignment"
    description: "Role/permission escalation via extra fields"
    severity: critical
  - type: "Auth Weakness"
    description: "No rate limiting on auth endpoints"
    severity: high
  - type: "Info Leak"
    description: "Spring Boot Actuator exposed"
    severity: critical
  - type: "Info Leak"
    description: "Metrics endpoint exposed"
    severity: medium
  - type: "Auth Bypass"
    description: "Default admin credentials"
    severity: critical
