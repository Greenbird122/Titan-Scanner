name: wordpress
version: 1.0
description: |
  WordPress playbook. Covers wp-json REST API enumeration, XMLRPC pingback
  abuse, wp-login brute force, user enumeration via ?author=N, version
  fingerprinting for known WP CVEs, plugin/theme enumeration via
  wp-content paths, and wp-config exposure.

fingerprint:
  body:
    - "wp-content|wp-includes|wp-json"
  headers:
    link: "wp-json|WordPress"
  url: []

auth:
  login_url: "/wp-login.php"
  username_field: "log"
  password_field: "pwd"
  token_field: null
  session_cookie: "wordpress_logged_in"
  # WP REST API can also authenticate via Application Password (header)
  alt_auth:
    header: "Authorization"
    scheme: "Basic"
    # Application password generated in WP admin > Users > Application Passwords

# ─── REST API Surface ───────────────────────────────────────────────────
web_services:
  endpoint: "/wp-json/wp/v2"
  format: "json"
  user_enum:
    - function: "GET /wp-json/wp/v2/users"
      args: {}
      finding: "User enumeration via REST API — returns usernames, slugs, IDs"
      severity: medium
      verify: "response contains array of user objects with slug and name"
    - function: "GET /wp-json/wp/v2/users/{id}"
      args: {}
      finding: "User lookup by ID — profile data for any user"
      severity: medium
      verify: "response contains user object"
  post_enum:
    - function: "GET /wp-json/wp/v2/posts"
      args: {per_page: 100}
      finding: "Post enumeration — all published posts with author IDs"
      severity: low
      verify: "response contains posts array"
    - function: "GET /wp-json/wp/v2/pages"
      args: {}
      finding: "Page enumeration — may include draft/private pages"
      severity: low
      verify: "response contains pages array"
    - function: "GET /wp-json/wp/v2/media"
      args: {per_page: 100}
      finding: "Media enumeration — file paths, upload dates, author IDs"
      severity: low
      verify: "response contains media array"
  plugin_enum:
    - function: "GET /wp-json/wp/v2/plugins"
      args: {}
      finding: "Plugin enumeration via REST — reveals installed plugins"
      severity: medium
      verify: "response contains plugins array (requires auth)"
    - function: "GET /wp-json"
      args: {}
      finding: "Site info disclosure — WP version, name, description, namespaces"
      severity: low
      verify: "response contains name, namespaces array"

# ─── HTTP Probes ────────────────────────────────────────────────────────
http_probes:
  - path: "/wp-json/wp/v2/users"
    method: GET
    finding: "User enumeration via unauthenticated REST API"
    severity: medium
    verify: "200 with array of user objects"
  - path: "/?author=1"
    method: GET
    finding: "User enumeration via author redirect — reveals username in URL"
    severity: medium
    verify: "301 redirect to /author/username/"
  - path: "/wp-login.php"
    method: GET
    finding: "Login page exposed — brute force vector"
    severity: low
    verify: "200 with login form"
  - path: "/wp-admin/"
    method: GET
    finding: "Admin panel exposed"
    severity: low
    verify: "200 or 302 redirect to login"
  - path: "/xmlrpc.php"
    method: POST
    body: '<?xml version="1.0"?><methodCall><methodName>system.listMethods</methodName><params></params></methodCall>'
    content_type: "text/xml"
    finding: "XMLRPC enabled — pingback DDoS and brute force via system.multicall"
    severity: medium
    verify: "200 with method list"
  - path: "/wp-content/uploads/"
    method: GET
    finding: "Directory listing on uploads"
    severity: low
    verify: "200 with directory index"
  - path: "/wp-config.php"
    method: GET
    finding: "wp-config.php accessible — database credentials leak"
    severity: critical
    verify: "200 with PHP code or DB credentials"
  - path: "/wp-config.php.bak"
    method: GET
    finding: "wp-config backup file exposed"
    severity: critical
    verify: "200 with PHP code"
  - path: "/.wp-config.php.swp"
    method: GET
    finding: "vim swap file of wp-config"
    severity: critical
    verify: "200 with file content"
  - path: "/wp-content/debug.log"
    method: GET
    finding: "Debug log exposed — may contain errors, paths, secrets"
    severity: high
    verify: "200 with log content"
  - path: "/wp-json/wp/v2/users/1"
    method: GET
    finding: "Admin user info via REST API"
    severity: medium
    verify: "200 with user object containing admin slug"

# ─── Version Fingerprinting ─────────────────────────────────────────────
version_fingerprint:
  patterns:
    - "name=\"generator\"[^>]*content=\"WordPress\\s+([\\d.]+)\""
    - "wp-includes/js/wp-emoji-release.min.js\\?ver=([\\d.]+)"
    - "wp-includes/css/dist/block-library/style.min.css\\?ver=([\\d.]+)"
  cves:
    "6.x.x":
      - id: "CVE-2024-XXXX"
        name: "Check wpvulndb.com for current version CVEs"
        severity: variable
    "5.x.x":
      - id: "CVE-2022-21683"
        name: "SQL injection in WP_Query"
        severity: critical

# ─── Plugin/Theme Path Brute ────────────────────────────────────────────
plugin_paths:
  - "/wp-content/plugins/akismet/akismet.php"
  - "/wp-content/plugins/contact-form-7/wp-contact-form-7.php"
  - "/wp-content/plugins/elementor/elementor.php"
  - "/wp-content/plugins/yoast-seo/wp-seo.php"
  - "/wp-content/plugins/wordfence/wordfence.php"
  - "/wp-content/plugins/jetpack/jetpack.php"
  - "/wp-content/plugins/woocommerce/woocommerce.php"
  - "/wp-content/plugins/wpforms/wpforms.php"
  - "/wp-content/plugins/duplicator/duplicator.php"
  - "/wp-content/plugins/all-in-one-wp-migration/constants.php"
  - "/wp-content/plugins/wp-file-manager/file_folder_manager.php"
  - "/wp-content/plugins/wpdiscuz/class.WpdiscuzCore.php"

discovery_seeds:
  - "/wp-json/"
  - "/wp-json/wp/v2/users"
  - "/wp-json/wp/v2/posts"
  - "/wp-login.php"
  - "/wp-admin/"
  - "/xmlrpc.php"
  - "/wp-content/uploads/"
  - "/?author=1"
  - "/?author=2"
  - "/wp-content/debug.log"
  - "/readme.html"
  - "/license.txt"

expected_findings:
  - type: "Info Leak"
    description: "User enumeration via REST API or ?author=N"
    severity: medium
  - type: "Info Leak"
    description: "WordPress version disclosure via generator meta"
    severity: low
  - type: "Info Leak"
    description: "Plugin/theme enumeration via wp-content paths"
    severity: medium
  - type: "Auth Weakness"
    description: "XMLRPC pingback enabled — DDoS amplification"
    severity: medium
  - type: "Info Leak"
    description: "wp-config backup or swap file exposed"
    severity: critical
  - type: "Info Leak"
    description: "Debug log exposed"
    severity: high
