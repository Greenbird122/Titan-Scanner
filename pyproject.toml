[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-scanner"
version = "1.0.0"
description = "Titan — Autonomous Penetration Testing Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Titan Security Lab"},
]
keywords = ["security", "penetration-testing", "vulnerability-scanner", "dast", "autopentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
full = [
    "playwright>=1.40.0",
    "flask>=3.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
tscan = "titan.tscan_main:main"

[project.urls]
Homepage = "https://github.com/titan-security-lab/titan"
Documentation = "https://github.com/titan-security-lab/titan#readme"
Repository = "https://github.com/titan-security-lab/titan"

[tool.setuptools.packages.find]
include = ["titan*"]
exclude = ["tests*", "docs*", "titan_states*", "titan_logs*", "titan_output*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.yaml", "*.yml", "*.json"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "T201",   # print found (scanner uses print for output)
    "S101",   # assert used (fine in tests)
    "S603",   # subprocess call (scanner runs tools)
    "S607",   # start process with partial path
    "B905",   # zip without strict= (Python 3.10 compat)
    "UP007",  # use X | Y for union (Python 3.10 compat)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
"titan/local_lab/*" = ["S101"]
"titan/ai/*" = ["T201"]

# ---------------------------------------------------------------------------
# Mypy (type checker)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disable_error_code = ["import-untyped"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["titan"]
omit = ["local_lab/*", "tests/*", "*/titan/transport/test_onion_scan.py"]

[tool.coverage.report]
show_missing = true
# Same omit list as [tool.coverage.run] so the standalone `coverage report`
# path (and the CI pytest --cov path) exclude the same files.
omit = ["local_lab/*", "tests/*", "*/titan/transport/test_onion_scan.py"]
# Measured floor is ~45% (full suite, 2026-09-07). Gated at 44 to absorb
# run-to-run variance across CI Python versions; raise this over time.
fail_under = 44

